ne);padding:12px 22px;display:flex;gap:20px;align-items:center;background:var(--panel)}.bottom span:last-child{margin-left:auto}.inspector{width:280px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:20px}.inspector .cover{aspect-ratio:16/9}.inspector .cover-title{font-size:22px}.inspector h2{font-size:21px;letter-spacing:-.5px;margin:18px 0 5px}.primary{background:#89a0fa;color:#121e42;font-weight:700;border-color:transparent}.play{width:100%;margin:17px 0 9px;padding:11px}.label{color:var(--muted);font-size:11px}.info-row{display:flex;justify-content:space-between;gap:10px;margin:12px 0;font-size:11px}.info-row span:first-child{color:var(--muted)}.divider{height:1px;background:var(--line);margin:19px 0}.inspector h3{font-size:12px;margin:18px 0 12px}.field{margin:15px 0}.field label{display:block;margin-bottom:6px;color:var(--muted);font-size:11px}.field select{width:100%}.fine{font-size:11px;line-height:1.6;color:var(--muted)}.row-actions{display:flex;gap:6px;flex-wrap:wrap}.row-actions button{font-size:11px}.danger{color:#f49da7}.notice{padding:13px 15px;background:#869fee12;border:1px solid #869fee35;border-radius:9px;font-size:12px;line-height:1.6;margin-bottom:22px}.notice.warning{background:#ffc57512;border-color:#ffc57545;color:#edc58e}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:21px;margin-bottom:15px}.card h2{font-size:16px;margin:0 0 8px}.card-header{display:flex;align-items:center;gap:12px;margin-bottom:14px}.launcher-mark{height:40px;width:40px;display:grid;place-items:center;background:var(--raised);border:1px solid var(--line);border-radius:10px;font-size:18px;font-weight:750}.card-header .right{margin-left:auto;color:var(--green);font-size:11px}.empty{min-height:350px;display:flex;align-items:center;justify-content:center;text-align:center;flex-direction:column;gap:12px}.empty h2{margin:0;font-size:22px}.empty .symbol{font-size:40px;color:var(--muted)}table{width: #fff;--sidebar:#edf0f7;--raised:#e9edf5;--text:#232b3e;--muted:#657187;--line:#24325b16;--accent:#415ac2;--active:#556fce;--green:#34745d}.light .notice.warning{color:#79501f}.light .danger{color:#b22e40}.light .game.selected .cover{outline-color:#627edb}.mobile-nav{display:none}.status-head{display:flex;gap:10px;align-items:center}.pill{border:1px solid var(--line);padding:5px 9px;border-radius:20px;font-size:10px;color:var(--muted)}.skeleton{height:230px;background:linear-gradient(110deg,var(--panel),var(--raised),var(--panel));border-radius:10px}.review-state{max-width:160px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}[hidden]{display:none!important}
.cover{container-type:inline-size}.cover .cover-title{font-size:clamp(13px,11.5cqw,29px);overflow-wrap:anywhere}.cover .cover-line{font-size:clamp(7px,3.5cqw,10px);letter-spacing:2px}.game[aria-pressed=true]{background:transparent;color:var(--text)}.icon-card>img{aspect-ratio:1;display:block;margin:0 auto}.icon-card p{min-height:42px}.icon-card{padding:15px}.icon-sizes{margin-top:10px;padding:8px}.icon-card>img{max-width:175px}

<body>
<div class="review"><strong>GAMEKIT / DESIGN REVIEW 01</strong><small>Interactive concept · sample data & original placeholder art</small><div class="right"><label class="sr-only" for="scenario">Preview state</label><select id="scenario" class="review-state"><option value="normal">Normal library</option><option value="empty">Empty library</option><option value="offline">Offline</option><option value="loading">Loading</option><option value="error">Library read error</option></select><button id="theme">Light appearance</button><button id="icons">Icon concepts</button></div></div>
<main class="window" aria-label="Gamekit design prototype">
<aside class="sidebar"><div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div><div class="brand"><img src="icon-case.svg" alt="Gamekit proposed icon">Gamekit</div><div class="group-title">Library</div><button class="nav active" data-page="all"><span class="glyph">▦</span>All Games<span class="count">8</span></button><button class="nav" data-page="favorites"><span class="glyph">☆</span>Favorites<span class="count" id="fav-count">2</span></button><div class="group-title">Launchers · preview</div><button class="nav" data-page="Steam"><span class="dot"></span>Steam<span class="count">4</span></button><button class="nav" data-page="Ubisoft"><span class="dot ubisoft"></span>Ubisoft<span class="count">2</span></button><button class="nav" data-page="Epic"><span class="dot epic"></span>Epic<span class="count">2</span></button><div class="group-title">Management</div><button class="nav" data-page="launchers"><span class="glyph">◫</span>Launchers</button><button class="nav" data-page="diagnostics"><span class="glyph">⌁</span>Diagnostics</button><button class="nav" data-page="settings"><span class="glyph">⚙</span>Settings…</button><footer><span>● Steam ready</span>Future providers shown for design only.<br>Only Steam is supported today.</footer></aside>
<section class="work"><header class="toolbar"><strong id="breadcrumb">Library</strong><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Search games" aria-label="Search games in selected library"></label><div class="segmented" aria-label="Library view"><button id="grid-button" aria-pressed="true" aria-label="Box art view">▦</button><button id="list-button" aria-pressed="false" aria-label="List view">☷</button></div><button id="inspector-button" aria-pressed="false" aria-label="Toggle game inspector">ⓘ</button></header><div class="body"><section class="page" id="page" aria-label="Current destination"></section><aside class="inspector" id="inspector" aria-label="Game details" hidden></aside></div><footer class="bottom"><span id="footer-state">8 installations</span><span>Concept only · no games launched or settings changed</span></footer></section>
</main><div class="toast" role="status" aria-live="polite" id="toast"></div>
<script>
const games=[
{id:'steam:1',name:'Stardew Valley',launcher:'Steam',size:0.692,state:'Installed',favorite:true,c1:'#66bba9',c2:'#244745',art:'valley',title:'Stardew<br>Valley',caption:'A little room to grow',profile:true},
{id:'steam:2',name:'Ace Combat 7',launcher:'Steam',size:65.66,state:'Installed',favorite:true,c1:'#54768f',c2:'#162738',art:'flight',title:'Ace<br>Combat 7',caption:'Skies unknown'},
{id:'steam:3',name:'Helldivers 2',launcher:'Steam',size:78.4,state:'Installed',c1:'#908754',c2:'#292c22',art:'orbit',title:'Helldivers<br>2',caption:'Into the unknown',profile:true},
{id:'steam:4',name:'Satisfactory',launcher:'Steam',size:30.2,state:'Installed',c1:'#bd8459',c2:'#374c4b',art:'industry',title:'Satisfactory',caption:'Build something bigger'},
{id:'ubisoft:1',name:'Anno 1800',launcher:'Ubisoft',size:45.3,state:'Installed',c1:'#8d9aa2',c2:'#344d5f',art:'industry',title:'Anno<br>1800',caption:'An age of invention'},
{id:'ubisoft:2',name:'Assassin’s Creed II',launcher:'Ubisoft',size:null,state:'Needs attention',c1:'#b5aaa1',c2:'#684e59',art:'industry',title:'Assassin’s<br>Creed II',caption:'A story through time'},
{id:'epic:1',name:'Satisfactory',launcher:'Epic',size:30.2,state:'Installed',c1:'#b8784d',c2:'#414857',art:'industry',title:'Satisfactory',caption:'A second installation'},
{id:'epic:2',name:'Hades',launcher:'Epic',size:null,state:'Updating',c1:'#9b5a68',c2:'#252039',art:'orbit',title:'Hades',caption:'One more escape'}];
const state={page:'all',view:'grid',selected:null,inspector:false,filter:'all',sort:'name',query:'',scenario:'normal',settings:'General',sharedSpace:'Desktop',settingsByGame:{}};
const page=document.querySelector('#page');const inspector=document.querySelector('#inspector');const sidebar=document.querySelector('.sidebar');const librarySidebar=sidebar.innerHTML;let toastTimer;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const size=g=>g.size===null?'Unavailable':g.size<1?`${Math.round(g.size*1000)} MB`:`${g.size.toFixed(1)} GB`;
function notify(text){document.querySelector('#toast').textContent=text;clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.querySelector('#toast').textContent='',6500)}
function art(g){let shapes='';if(g.art==='valley')shapes='<circle cx="155" cy="103" r="43" fill="#ffe5aa"/><path d="M0 186 82 102 137 175 190 131 300 221V450H0" fill="#275b59"/><path d="M0 245 100 179 220 238 300 172V450H0" fill="#183f43"/><path d="M90 450q155-120 65-230 130 80 68 230" fill="#76c7ae" opacity=".7"/>';if(g.art==='flight')shapes='<circle cx="205" cy="90" r="65" fill="#cde6ee" opacity=".4"/><path d="m-30 240 400-185M-40 265 400-185" stroke="#d9e8ec" opacity=".2" stroke-width="4"/><path d="m145 116 18 61 84 29-3 9-77-9-7 37-17-3-4-37-75-29 3-8 77 11Z" fill="#e4eaf0" transform="rotate(28 150 180)"/><path d="M0 354q150-70 300-20v116H0Z" fill="#102536"/>';if(g.art==='orbit')shapes='<circle cx="183" cy="123" r="89" fill="#e5d19d" opacity=".6"/><ellipse cx="183" cy="123" rx="136" ry="31" fill="none" stroke="#faf2d5" stroke-width="5" opacity=".45" transform="rotate(-30 183 123)"/><path d="M0 355 62 271 109 318 189 239 300 341v109H0" fill="#171d2c"/><circle cx="51" cy="60" r="3" fill="white"/><circle cx="266" cy="34" r="2" fill="white"/>';if(g.art==='industry')shapes='<circle cx="218" cy="100" r="59" fill="#edd2a4" opacity=".6"/><path d="M0 251h38V137h28v114h28v-67h27v67h35V110h25v141h24V162h37v89h58v199H0" fill="#21363f"/><path d="M0 268h300M51 160h14m97-21h18m35 45h25M82 450l30-184m130 184-42-184" stroke="#bfcebd" stroke-width="3" opacity=".3"/>';return `<svg viewBox="0 0 300 450" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${shapes}</svg>`}
function launcherIcon(g){const marks={Steam:'<circle cx="23" cy="10" r="7"/><circle cx="23" cy="10" r="4"/><circle cx="10" cy="24" r="5"/><path d="m1 19 10 5m3-3 5-6m-4 11 10-10"/>',Ubisoft:'<path d="M27 10C20-3 1 4 3 19c1 13 23 15 26 1C32 8 14 4 10 14c-4 10 12 15 14 5 1-6-8-8-9-3-1 3 4 5 5 2"/>',Epic:'<path d="M5 3h22v23l-11 5L5 26Z"/><path d="M9 10h5m-5 0v12m0-6h4m-4 6h5m4-12v12m0-12h5v6h-5"/>'};return `<span class="launcher-corner" role="img" aria-label="${g.launcher} launcher" title="${g.launcher} · illustrative launcher mark"><svg viewBox="0 0 32 34" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${marks[g.launcher]||'<circle cx="16" cy="16" r="12"/>'}</svg></span>`}
function cover(g,badge=true){return `<div class="cover" style="--c1:${g.c1};--c2:${g.c2}">${art(g)}${launcherIcon(g)}<span class="cover-type">CONCEPT ART</span><span class="cover-title">${g.title}<span class="cover-line">${g.caption}</span></span>${badge&&g.favorite?'<span class="badge" aria-label="Favorite">★</span>':''}</div>`}
const library=()=>['all','favorites','Steam','Ubisoft','Epic'].includes(state.page);
function filtered(){return games.filter(g=>(state.page==='all'||state.page==='favorites'&&g.favorite||g.launcher===state.page)&&g.name.toLowerCase().includes(state.query.toLowerCase())&&(state.filter==='all'||state.filter==='ready'&&g.state==='Installed'||state.filter==='attention'&&g.state!=='Installed')).sort((a,b)=>state.sort==='size'?(b.size??-1)-(a.size??-1):state.sort==='launcher'?a.launcher.localeCompare(b.launcher)||a.name.localeCompare(b.name):a.name.localeCompare(b.name)||a.launcher.localeCompare(b.launcher))}
function heading(title,sub,extra=''){return `<div class="heading"><div><div class="eyebrow">${library()?'Your library':'Gamekit'}</div><h1>${title}</h1><p class="sub">${sub}</p></div>${extra}</div>`}
function navigate(dest){state.page=dest;state.query='';document.querySelector('#search').value='';sidebar.innerHTML=librarySidebar;sidebar.classList.remove('settings-sidebar');render()}
function render(){document.querySelector('#breadcrumb').textContent=library()?'Library':state.page==='icons'?'Design studio':state.page[0].toUpperCase()+state.page.slice(1);document.querySelector('#search').disabled=!library();document.querySelector('#grid-button').disabled=!library();document.querySelector('#list-button').disabled=!library();document.querySelector('#inspector-button').disabled=!library();document.querySelector('#grid-button').setAttribute('aria-pressed',state.view==='grid');document.querySelector('#list-button').setAttribute('aria-pressed',state.view==='list');if(library())renderLibrary();else if(state.page==='launchers')renderLaunchers();else if(state.page==='settings')renderSettings();else if(state.page==='diagnostics')renderDiagnostics();else renderIcons();syncSidebar();renderInspector()}
function syncSidebar(){
 if(state.page==='settings'){
  const tabs=page.querySelector('.settings-tabs');
  sidebar.classList.add('settings-sidebar');
  sidebar.innerHTML='<div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div><div class="brand"><img src="icon-case.svg" alt="Gamekit proposed icon">Gamekit</div><button class="settings-back" data-page="launchers">← Back to Launchers</button><div class="group-title">Settings</div>';
  sidebar.append(tabs);
  sidebar.insertAdjacentHTML('beforeend','<footer>Shared preferences apply to games using the shared default.<br><br>Per-game overrides stay in the library inspector.</footer>');
  const content=page.querySelector('.settings-grid');content.className='settings-main';
  page.querySelector('.heading h1').textContent=state.settings;
  page.querySelector('.heading .sub').textContent='Gamekit settings · changes shown here are preview-only';
  document.querySelector('#search').closest('.search').hidden=true;
  document.querySelector('.segmented').hidden=true;
  document.querySelector('#inspector-button').hidden=true;
 }else{
  if(sidebar.classList.contains('settings-sidebar')){sidebar.innerHTML=librarySidebar;sidebar.classList.remove('settings-sidebar')}
  document.querySelector('#search').closest('.search').hidden=false;
  document.querySelector('.segmented').hidden=false;
  document.querySelector('#inspector-button').hidden=false;
 }
 document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===state.page));
 const count=document.querySelector('#fav-count');if(count)count.textContent=games.filter(g=>g.favorite).length;
}
function renderLibrary(){let list=filtered();const future=!['all','favorites','Steam'].includes(state.page);let title=state.page==='all'?'All Installed Games':state.page==='favorites'?'Favorites':state.page;page.innerHTML=heading(title,`${list.length} installations · ${list.filter(g=>g.state==='Installed').length} ready to play`,future?'<span class="pill">Future provider preview</span>':'')+`<div class="filters"><button data-filter="all" aria-pressed="${state.filter==='all'}">All installations</button><button data-filter="ready" aria-pressed="${state.filter==='ready'}">Ready to play</button><button data-filter="attention" aria-pressed="${state.filter==='attention'}">Needs attention</button><label class="size">${state.view==='grid'?'Cover size <input id="size" type="range" min="125" max="220" value="145" aria-label="Cover size">':''}</label><label class="sr-only" for="sort">Sort games</label><select id="sort"><option value="name">Sort: Name</option><option value="launcher">Sort: Launcher</option><option value="size">Sort: Size</option></select></div>`;
 if(state.scenario==='offline')page.innerHTML+='<div class="notice">Offline · Showing cached library and artwork. Launchers may require a connection to sign in or start a game.</div>';
 if(state.scenario==='error')page.innerHTML+='<div class="notice warning">Steam library could not be refreshed. Last known entries remain visible, but Steam actions need a fresh check. <button data-action="diagnostics">View details</button> <button data-action="retry">Retry</button></div>';
 if(state.scenario==='loading'){page.innerHTML+='<div class="grid" aria-label="Loading library"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>';return}
 if(state.scenario==='empty'||!list.length){page.innerHTML+=`<div class="empty"><div class="symbol">▦</div><h2>${state.scenario==='empty'?'Your library starts here':'No matching games'}</h2><p class="sub">${state.scenario==='empty'?'Set up Windows Steam, then install your first game in its launcher.':'Try another search or clear your filters.'}</p><button class="primary" data-action="${state.scenario==='empty'?'launchers':'clear'}">${state.scenario==='empty'?'Set up a launcher':'Clear filters'}</button></div>`}else if(state.view==='grid'){page.innerHTML+=`<div class="grid" role="group" aria-label="Game covers">${list.map(g=>`<button class="game ${g.id===state.selected?'selected':''}" data-game="${g.id}" aria-pressed="${g.id===state.selected}" aria-label="${esc(g.name)}, ${g.launcher}, ${size(g)}, ${g.state}">${cover(g)}<span class="title">${esc(g.name)}</span><span class="meta"><span class="dot ${g.launcher.toLowerCase()}"></span>${g.launcher}<span>${g.state==='Installed'?size(g):g.state}</span></span></button>`).join('')}</div>`}else{page.innerHTML+=`<table><thead><tr><th>Game</th><th>Launcher</th><th>State</th><th>Reported size</th></tr></thead><tbody>${list.map(g=>`<tr class="${g.id===state.selected?'selected':''}"><td><button class="list-game" data-game="${g.id}" aria-pressed="${g.id===state.selected}">${cover(g,false)}<strong>${esc(g.name)}</strong>${g.favorite?' ★':''}</button></td><td>${g.launcher}</td><td><span class="state">${g.state==='Installed'?'●':''} ${g.state}</span></td><td>${size(g)}</td></tr>`).join('')}</tbody></table>`}
 document.querySelector('#footer-state').textContent=`${list.length} installations · ${list.filter(g=>g.size!==null).reduce((n,g)=>n+g.size,0).toFixed(1)} GB reported · ${list.filter(g=>g.size===null).length} unknown`;
 document.querySelector('#sort').value=state.sort;document.querySelector('#sort').onchange=e=>{state.sort=e.target.value;render()};let slider=document.querySelector('#size');if(slider)slider.oninput=e=>page.style.setProperty('--tile',e.target.value+'px')}
function renderInspector(){let g=games.find(g=>g.id===state.selected);inspector.hidden=!state.inspector||!library()||state.scenario==='empty'||state.scenario==='loading';document.querySelector('#inspector-button').setAttribute('aria-pressed',!inspector.hidden);if(inspector.hidden)return;if(!g){inspector.innerHTML='<div class="empty"><span class="symbol">ⓘ</span><h2>Select a game</h2><p class="fine">Artwork, launch status and settings appear here.</p></div>';return}const settings=state.settingsByGame[g.id]||{graphics:'Use shared default',space:'Use shared default'};inspector.innerHTML=`${cover(g,false)}<h2>${esc(g.name)}</h2><p class="sub">${g.launcher} · Windows installation</p><button class="primary play" data-action="play">${g.state==='Installed'?'▶ Play':'Open '+g.launcher+' to resolve'}</button><button style="width:100%" data-action="favorite">${g.favorite?'★ Favorited':'☆ Add to Favorites'}</button><div class="divider"></div><div class="info-row"><span>Installation</span><span>${g.state}</span></div><div class="info-row"><span>Launcher-reported size</span><span>${size(g)}</span></div><div class="info-row"><span>Compatibility</span><span>Not assessed in mockup</span></div><h3>Launch preferences</h3><div class="field"><label for="graphics">Graphics backend</label><select id="graphics"><option>Use shared default</option><option>Automatic</option><option>Metal 3</option><option disabled>DXMT — unavailable in preview</option></select></div><div class="field"><label for="space">Fullscreen Space</label><select id="space"><option>Use shared default</option><option>Use fullscreen Space</option><option>Keep on desktop</option></select></div><p class="fine">Shared: Metal 3 · ${state.sharedSpace}<br>Changes apply at the next launch. Stop the launcher session to edit real runtime settings.</p><button data-action="compatibility" style="width:100%">All compatibility settings…</button><div class="divider"></div><div class="row-actions"><button data-action="show-launcher">Show ${g.launcher}</button><button data-action="files">Reveal files</button><button class="danger" data-action="uninstall">Uninstall…</button></div><p class="fine">Settings here are mockup-only. No files or launcher sessions are changed.</p>`;for(const key of ['graphics','space']){const el=document.querySelector('#'+key);el.value=settings[key];el.onchange=()=>{state.settingsByGame[g.id]={...settings,[key]:el.value};notify('Preview preference updated for '+g.name+' only.')}}}
function renderLaunchers(){page.innerHTML=heading('Launchers','Your game sources, managed in one place.')+'<div class="notice">Steam is available today. Future integrations are planned in this order: Ubisoft → Epic → Battle.net → GOG. The library samples preview that future structure.</div>'+`<div class="card"><div class="card-header"><span class="launcher-mark">S</span><div><h2>Windows Steam</h2><span class="label">Managed environment · 4 sample installations</span></div><span class="right">● Ready</span></div><p class="sub">Install games in Windows Steam. They appear automatically in your library.</p><div class="row-actions" style="margin-top:18px"><button class="primary" data-action="show-launcher">Show Windows Steam</button><button data-action="stop">Stop Steam…</button><button data-page="Steam">Browse games</button><button data-action="recovery">Setup & recovery…</button></div><p class="fine">Stopping this managed session also closes its games. Quitting Gamekit leaves them running.</p></div>`+['Ubisoft','Epic','Battle.net','GOG'].map((p,i)=>`<div class="card"><div class="card-header"><span class="launcher-mark">${p[0]}</span><div><h2>${p}</h2><span class="label">Integration planned · ${i+1} in delivery order</span></div><span class="right" style="color:var(--muted)">Not available yet</span></div></div>`).join('');document.querySelector('#footer-state').textContent='Launcher management · concept'}
function renderSettings(){const tabs=['General','Game defaults','Runtime','Storage'];const title=state.settings;let body='';if(title==='General')body=`<div class="setting-row"><div><strong>Open Gamekit to</strong><p class="fine">Start with your games.</p></div><select aria-label="Startup destination"><option>All Installed Games</option></select></div><div class="setting-row"><div><strong>Library appearance</strong><p class="fine">Follow the Mac’s appearance by default.</p></div><button id="settings-theme">Switch light / dark</button></div><div class="setting-row"><div><strong>Default view</strong><p class="fine">Grid and list share selection and filters.</p></div><select id="default-view"><option value="grid">Box art</option><option value="list">List</option></select></div>`;if(title==='Game defaults')body=`<div class="setting-row"><div><strong>Graphics backend</strong><p class="fine">Used by games without a saved override.</p></div><select aria-label="Shared graphics"><option>Metal 3</option><option>Automatic</option></select></div><div class="setting-row"><div><strong>Fullscreen presentation</strong><p class="fine">Display-sized windows only. Per-game choices win.</p></div><select id="shared-space"><option>Desktop</option><option>Separate Space</option></select></div><p class="fine">These controls are locked while the managed session is active in the real application.</p>`;if(title==='Runtime')body='<h2>Windows compatibility runtime</h2><p class="sub">Sikarugir Wine 10 · driver-version-1</p><div class="divider"></div><p class="fine">Prerequisite checks, runtime selection and rollback live here, rather than above your game library. Each future launcher will expose its own supported runtime configuration.</p><button data-action="runtime">Review runtime checks</button>';if(title==='Storage')body='<h2>Storage & maintenance</h2><p class="sub">Game sizes are supplied by their launchers.</p><div class="divider"></div><p class="fine">Recovery archives, obsolete launcher caches, and diagnostics have separate cleanup controls. This screen must distinguish recoverable data from disposable caches.</p><button data-action="storage">Inspect managed storage</button>';page.innerHTML=heading('Settings','Native macOS Settings window in the shipping app · ⌘,')+`<div class="settings-grid"><nav class="settings-tabs" aria-label="Settings sections">${tabs.map(t=>`<button data-settings="${t}" class="${t===title?'active':''}">${t}</button>`).join('')}</nav><div class="card"><h2>${title}</h2><div class="divider"></div>${body}</div></div>`;let dv=document.querySelector('#default-view');if(dv){dv.value=state.view;dv.onchange=e=>{state.view=e.target.value;notify('Preview library view updated')}}let ss=document.querySelector('#shared-space');if(ss){ss.value=state.sharedSpace;ss.onchange=e=>{state.sharedSpace=e.target.value;notify('Preview shared Space preference updated; per-game choices stay intact.')}}document.querySelector('#footer-state').textContent='Settings preview · values remain in this browser session'}
function renderDiagnostics(){page.innerHTML=heading('Diagnostics','Troubleshooting when you need it. Out of the way when you don’t.')+'<div class="card"><div class="card-header"><h2>Recent operations</h2><span class="right">Sample history</span></div><table><thead><tr><th>Operation</th><th>Source</th><th>Outcome</th></tr></thead><tbody><tr><td>Library refresh</td><td>Steam</td><td>Complete</td></tr><tr><td>Launch request</td><td>Stardew Valley</td><td>Process created</td></tr><tr><td>Installation check</td><td>Ubisoft preview</td><td>Needs attention</td></tr></tbody></table><p class="fine">A process-created event is not a gameplay-readiness result. Raw logs remain private; exported summaries use the existing redaction rules.</p><button data-action="logs">View local logs</button> <button data-action="export">Export safe summary…</button></div>';document.querySelector('#footer-state').textContent='Diagnostics · sample records'}
function renderIcons(){page.innerHTML=heading('A home in the Dock','Three original directions. Same native character, different emphasis.')+`<div class="icon-grid">${[['case','01 · Game case','Recommended. A library-first mark with a controller inset. Calm indigo and teal.'],['stack','02 · Collection','Layered cases express multiple libraries gathered in one place.'],['toolkit','03 · Toolkit','A practical compatibility toolkit with an unmistakable gaming cue.']].map(([id,title,desc])=>`<article class="icon-card"><img src="icon-${id}.svg" alt="${title} app icon concept"><h2>${title}</h2><p class="fine">${desc}</p><div class="icon-sizes">${[64,32,16].map(s=>`<img src="icon-${id}.svg" width="${s}" height="${s}" alt="${s} pixel preview">`).join('')}</div><div class="icon-sizes dark">${[64,32,16].map(s=>`<img src="icon-${id}.svg" width="${s}" height="${s}" alt="${s} pixel dark-background preview">`).join('')}</div><p><a href="icon-${id}.svg">Open editable SVG</a></p><button data-icon="${id}">Preview in sidebar</button></article>`).join('')}</div><p class="design-note">Concept artwork, not final app-icon assets. Final production includes optical refinement at small sizes, macOS asset variants, current Xcode/Icon Composer evaluation, and checks in Finder, Dock and app switching. No third-party logo or game artwork is used here.</p>`;document.querySelector('#footer-state').textContent='Icon review · original editable vector concepts'}
document.addEventListener('click',e=>{const n=e.target.closest('[data-page]');if(n){navigate(n.dataset.page);return}const f=e.target.closest('[data-filter]');if(f){state.filter=f.dataset.filter;render();return}const s=e.target.closest('[data-settings]');if(s){state.settings=s.dataset.settings;render();return}const i=e.target.closest('[data-icon]');if(i){document.querySelector('.brand img').src='icon-'+i.dataset.icon+'.svg';notify('Sidebar icon preview updated. Tell me which direction you prefer.');return}const g=e.target.closest('[data-game]');if(g){state.selected=g.dataset.game;state.inspector=true;render();document.querySelector(`[data-game="${state.selected}"]`)?.focus();return}const a=e.target.closest('[data-action]');if(!a)return;const action=a.dataset.action;const game=games.find(g=>g.id===state.selected);if(['launchers','diagnostics'].includes(action)){navigate(action);return}if(action==='clear'){state.query='';state.filter='all';document.querySelector('#search').value='';render();return}if(action==='retry'){state.scenario='normal';document.querySelector('#scenario').value='normal';render();notify('Preview refresh complete.');return}if(action==='favorite'&&game){game.favorite=!game.favorite;render();return}if(action==='play'){notify(state.scenario==='error'&&game?.launcher==='Steam'?'Preview: refresh Steam ownership before launching.':`Preview only: ${game?.state==='Installed'?'launch '+game.name+' through its '+game.launcher+' installation':'open the launcher to resolve this installation'}. No command was sent.`);return}if(action==='show-launcher'){notify('Preview only: bring the selected managed launcher forward.');return}if(action==='uninstall'){if(confirm(`Mockup confirmation: uninstall ${game?.name} through ${game?.launcher}? This preview will not delete anything.`))notify('Preview only: the provider would open its uninstall flow.');return}if(action==='stop'){notify('Preview: confirm stopping this launcher and all games in its managed session.');return}if(action==='compatibility'){notify('Design: open full compatibility sheet with profile revision/source, cursor guard where supported, and JSON import/export.');return}notify('Design action: '+action+'. This mockup performs no system operations.')});
document.addEventListener('dblclick',e=>{const g=e.target.closest('[data-game]');if(g){state.selected=g.dataset.game;document.querySelector('[data-action="play"]')?.click()}});
document.querySelector('#search').oninput=e=>{state.query=e.target.value;render()};document.querySelector('#scenario').onchange=e=>{state.scenario=e.target.value;if(!library())state.page='all';render()};document.querySelector('#grid-button').onclick=()=>{state.view='grid';render()};document.querySelector('#list-button').onclick=()=>{state.view='list';render()};document.querySelector('#inspector-button').onclick=()=>{state.inspector=!state.inspector;renderInspector()};document.querySelector('#icons').onclick=()=>navigate('icons');function theme(){document.body.classList.toggle('light');document.querySelector('#theme').textContent=document.body.classList.contains('light')?'Dark appearance':'Light appearance'}document.querySelector('#theme').onclick=theme;document.addEventListener('click',e=>{if(e.target.id==='settings-theme')theme()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){state.inspector=false;renderInspector()}if((e.metaKey||e.ctrlKey)&&e.key==='f'&&library()){e.preventDefault();document.querySelector('#search').focus()}if((e.metaKey||e.ctrlKey)&&e.key===','){e.preventDefault();navigate('settings')}});render();
</script>
</body>
