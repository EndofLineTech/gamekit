name: Build and test

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main, "task/**"]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Install project generator
        run: |
          brew install xcodegen
          xcodegen --version
      - name: Core tests, diagnostic tests, and native app build
        run: make check
      - name: Native app launch smoke test
        run: make ui-test
