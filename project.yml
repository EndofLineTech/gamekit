name: Gamekit
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
  Distribution: release
packages:
  GamekitCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
  configs:
    Distribution:
      CODE_SIGN_IDENTITY: Developer ID Application
      DEVELOPMENT_TEAM: $(GAMEKIT_DISTRIBUTION_TEAM)
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      OTHER_CODE_SIGN_FLAGS: --timestamp
targets:
  RosettaProbe:
    type: application
    platform: macOS
    sources: [Sources/RosettaProbe]
    info:
      path: Sources/RosettaProbe/Info.plist
      properties:
        CFBundleDisplayName: Gamekit Rosetta Check
        LSUIElement: true
    settings:
      base:
        PRODUCT_NAME: RosettaProbe
        PRODUCT_BUNDLE_IDENTIFIER: tech.endofline.gamekit.rosetta-probe
        ARCHS: x86_64
        ONLY_ACTIVE_ARCH: NO
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
      configs:
        Distribution:
          ENABLE_HARDENED_RUNTIME: YES
  GamekitProcessCounters:
    type: tool
    platform: macOS
    sources:
      - diagnostics/process_counters.c
      - Sources/CProcessSupport/ProcessSupport.c
    settings:
      base:
        PRODUCT_NAME: GamekitProcessCounters
        CLANG_ENABLE_CODE_COVERAGE: NO
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Sources/CProcessSupport/include"]
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
        SKIP_INSTALL: YES
      configs:
        Distribution:
          ENABLE_HARDENED_RUNTIME: YES
          PRODUCT_BUNDLE_IDENTIFIER: tech.endofline.gamekit.process-counters
  WineGameIdentity:
    type: library.dynamic
    platform: macOS
    sources: [Sources/WineGameIdentity]
    settings:
      base:
        ARCHS: x86_64
        ONLY_ACTIVE_ARCH: NO
        CLANG_ENABLE_OBJC_ARC: YES
        CLANG_ENABLE_CODE_COVERAGE: NO
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
        OTHER_LDFLAGS: ["-framework", "Foundation", "-framework", "AppKit"]
        SKIP_INSTALL: YES
  Gamekit:
    type: application
    platform: macOS
    sources: [App]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Gamekit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSSupportsGameMode: false
    dependencies:
      - package: GamekitCore
      - target: RosettaProbe
        link: false
        embed: true
        codeSign: true
        copy:
          destination: resources
      - target: GamekitProcessCounters
        link: false
        embed: true
        codeSign: true
        copy:
          destination: executables
      - target: WineGameIdentity
        link: false
        embed: true
        codeSign: true
        copy:
          destination: frameworks
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: tech.endofline.gamekit
        PRODUCT_NAME: Gamekit
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 2
        ENABLE_APP_SANDBOX: NO
      configs:
        Distribution:
          ENABLE_HARDENED_RUNTIME: YES
  GamekitUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests, tests/GamekitCoreTests/GameFixtures.swift]
    dependencies:
      - target: Gamekit
      - package: GamekitCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.endofline.gamekit.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Gamekit
schemes:
  Gamekit:
    build:
      targets:
        Gamekit: all
        GamekitUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [GamekitUITests]
      gatherCoverageData: true
