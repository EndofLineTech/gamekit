name: Gamekit
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
packages:
  GamekitCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
targets:
  Gamekit:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: GamekitCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.endofline.gamekit
        PRODUCT_NAME: Gamekit
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Gamekit
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_APP_SANDBOX: NO
  GamekitUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    dependencies:
      - target: Gamekit
      - package: GamekitCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.endofline.gamekit.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Gamekit
schemes:
  Gamekit:
    build:
      targets:
        Gamekit: all
        GamekitUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [GamekitUITests]
      gatherCoverageData: true
